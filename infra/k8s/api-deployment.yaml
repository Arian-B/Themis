# =============================================================================
# Themis API — Kubernetes Deployment
# Phase 6 target. Adapt image tag via Helm values or kustomize overlay.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: themis-api
  namespace: themis
  labels:
    app: themis-api
    version: "0.1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: themis-api
  template:
    metadata:
      labels:
        app: themis-api
    spec:
      containers:
        - name: api
          # TODO (Phase 6): Replace with GHCR image URL from deploy.yml
          image: ghcr.io/your-org/themis/themis-api:sha-000000
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: themis-secrets  # Kubernetes Secret from Terraform-managed Secret Manager
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: themis-api-svc
  namespace: themis
spec:
  selector:
    app: themis-api
  ports:
    - port: 80
      targetPort: 8000
---
# Horizontal Pod Autoscaler — scale out under load
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: themis-api-hpa
  namespace: themis
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: themis-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
