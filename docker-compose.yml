# =============================================================================
# Themis — Local Development Docker Compose
# =============================================================================
# Services managed by Compose:
#   neo4j           Knowledge graph (entities, relationships, portfolio memory)
#   qdrant          Local Vector store (optional fallback if Qdrant Cloud not used)
#   api             Themis FastAPI backend service
#
# Standalone / External services (NOT managed by this compose file):
#   Ollama          Managed separately as standalone container `themis-ollama`
#                   or host process at http://localhost:11434
#   Langfuse        Using Langfuse Cloud (https://cloud.langfuse.com)
#   n8n             Using pre-existing standalone n8n instance
#   Supabase        Using cloud instance (https://*.supabase.co)
#
# Usage:
#   docker compose up -d           # Start local services (Neo4j, Qdrant, API)
#   docker compose logs -f api     # Tail FastAPI logs
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Neo4j — Knowledge Graph
  # UI / Browser: http://localhost:7474  (user: neo4j, pass: from .env)
  # Bolt: bolt://localhost:7687
  # Plugin: APOC (required for merge procedures and graph algorithms)
  # ---------------------------------------------------------------------------
  neo4j:
    image: neo4j:5.19-community
    container_name: themis-neo4j
    ports:
      - "7474:7474"   # HTTP / Browser UI
      - "7687:7687"   # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - themis-net

  # ---------------------------------------------------------------------------
  # Qdrant — Local Vector Store (optional dev fallback)
  # Production / primary uses Qdrant Cloud specified via QDRANT_URL in .env.
  # UI: http://localhost:6333/dashboard
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: themis-qdrant
    ports:
      - "6333:6333"   # REST API + UI
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - themis-net

  # ---------------------------------------------------------------------------
  # NOTE: Ollama is managed separately outside Compose.
  # It runs as a standalone container named `themis-ollama` on port 11434.
  # To pull required models manually:
  #   docker exec -it themis-ollama ollama pull nomic-embed-text
  #   docker exec -it themis-ollama ollama pull llama3.1:8b
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Themis API — FastAPI backend service
  # Rebuilt on file changes in dev via bind mount + uvicorn --reload.
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: development
    container_name: themis-api
    ports:
      - "8000:8000"
    volumes:
      - .:/app   # bind mount for hot reload
    environment:
      # Infrastructure URLs
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      QDRANT_URL: ${QDRANT_URL}
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      OLLAMA_HOST: http://host.docker.internal:11434
      # Langfuse Cloud
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_HOST: ${LANGFUSE_HOST}
      # LLM config
      KIMI_API_KEY: ${KIMI_API_KEY}
      EMBEDDING_PROVIDER: ollama
      OLLAMA_EMBED_MODEL: nomic-embed-text
      OLLAMA_CLASSIFY_MODEL: llama3.1:8b
      # Auth & App
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      ENVIRONMENT: development
      LOG_LEVEL: DEBUG
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      neo4j:
        condition: service_healthy
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - themis-net

# =============================================================================
# Volumes — persisted data across container restarts
# =============================================================================
volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
  qdrant_data:

# =============================================================================
# Networks — isolated bridge network
# =============================================================================
networks:
  themis-net:
    driver: bridge
