name: 'themis_dbt'
version: '1.0.0'
config-version: 2

profile: 'themis_dbt'

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  themis_dbt:
    +materialized: view
    staging:
      +materialized: table
    marts:
      +materialized: table

vars:
  tenant_id: "default_tenant"