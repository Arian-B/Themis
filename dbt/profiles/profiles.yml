themis_dbt:
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('SUPABASE_HOST') }}"
      port: 5432
      user: "{{ env_var('SUPABASE_USER') }}"
      password: "{{ env_var('SUPABASE_PASSWORD') }}"
      dbname: "postgres"
      schema: public
      threads: 4
      keepalives_idle: 0
      connect_timeout: 10
      retries: 3
    prod:
      type: postgres
      host: "{{ env_var('SUPABASE_HOST') }}"
      port: 5432
      user: "{{ env_var('SUPABASE_USER') }}"
      password: "{{ env_var('SUPABASE_PASSWORD') }}"
      dbname: "postgres"
      schema: public
      threads: 4
      keepalives_idle: 0
      connect_timeout: 10
      retries: 3
  target: dev